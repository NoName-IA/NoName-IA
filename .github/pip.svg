<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" role="img" aria-label="Pip se asoma detrás de las cartas">
<defs>
<pattern id="dt" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#00e5a0" fill-opacity=".12"/></pattern>
<linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00e5a0" stop-opacity="0"/><stop offset="1" stop-color="#00e5a0" stop-opacity=".16"/></linearGradient>
<linearGradient id="cf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1712"/><stop offset="1" stop-color="#030605"/></linearGradient>
<radialGradient id="pb" cx="38%" cy="20%" r="85%"><stop offset="0" stop-color="#ffffff" stop-opacity=".40"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<clipPath id="vp"><rect width="1000" height="200" rx="12"/></clipPath>

<g id="pipart">
  <path d="M0 -68 C -2 -74 -1 -78 0 -81" fill="none" stroke="#2b8e74" stroke-width="2.6" stroke-linecap="round"/>
  <circle class="orb" cx="0" cy="-82" r="4" fill="#00e5a0"/>
  <circle cx="-34" cy="-26" r="8.5" fill="#2b8e74"/>
  <circle cx="34" cy="-26" r="8.5" fill="#2b8e74"/>
  <path d="M0 -68 C 22 -68 34 -53 34 -35 L34 44 L-34 44 L-34 -35 C-34 -53 -22 -68 0 -68 Z" fill="#5fd0ad"/>
  <path d="M0 -68 C 22 -68 34 -53 34 -35 L34 44 L-34 44 L-34 -35 C-34 -53 -22 -68 0 -68 Z" fill="url(#pb)"/>
  <ellipse cx="-24" cy="-30" rx="6" ry="3.6" fill="#2b8e74" opacity=".4"/>
  <ellipse cx="24" cy="-30" rx="6" ry="3.6" fill="#2b8e74" opacity=".4"/>
  <g class="eyes">
    <g class="eye"><ellipse cx="-13" cy="-45" rx="10.5" ry="11.5" fill="#fff"/>
      <g class="pup"><circle cx="-13" cy="-44" r="5.2" fill="#0a1612"/><circle cx="-11.2" cy="-46" r="1.8" fill="#fff" opacity=".9"/></g></g>
    <g class="eye"><ellipse cx="13" cy="-45" rx="10.5" ry="11.5" fill="#fff"/>
      <g class="pup"><circle cx="13" cy="-44" r="5.2" fill="#0a1612"/><circle cx="14.8" cy="-46" r="1.8" fill="#fff" opacity=".9"/></g></g>
  </g>
  <path class="m-idle" d="M-6 -26 Q0 -21 6 -26" fill="none" stroke="#0a1612" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse class="m-o" cx="0" cy="-25" rx="4" ry="5.2" fill="#0a1612"/>
</g>

<g id="cards">
  <g transform="translate(-86 10) rotate(-9)"><rect x="-52" y="92" width="104" height="120" rx="9" fill="url(#cf)" stroke="#0f2a22"/>
    <text x="-38" y="116" font-family="monospace" font-size="13" fill="#00e5a0" fill-opacity=".75">&lt;/&gt;</text></g>
  <g transform="translate(86 10) rotate(9)"><rect x="-52" y="92" width="104" height="120" rx="9" fill="url(#cf)" stroke="#0f2a22"/>
    <text x="24" y="116" font-family="monospace" font-size="13" fill="#00e5a0" fill-opacity=".75" text-anchor="end">{ }</text></g>
  <g><rect x="-58" y="92" width="116" height="120" rx="10" fill="url(#cf)" stroke="#0f2a22" stroke-width="1.2"/>
    <text x="-44" y="116" font-family="monospace" font-size="13" fill="#00e5a0">$_</text>
    <rect x="-44" y="130" width="60" height="3" rx="1.5" fill="#00e5a0" fill-opacity=".45"/>
    <rect x="-44" y="140" width="80" height="3" rx="1.5" fill="#e8e8e8" fill-opacity=".22"/>
    <rect x="-44" y="150" width="44" height="3" rx="1.5" fill="#e8e8e8" fill-opacity=".22"/></g>
</g>
<g id="ghost"><rect x="-58" y="92" width="116" height="120" rx="10" fill="none" stroke="currentColor" stroke-width="2"/><rect x="-138" y="92" width="104" height="120" rx="9" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-9 -86 152)"/><rect x="34" y="92" width="104" height="120" rx="9" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(9 86 152)"/></g>
</defs>

<style>
/* ciclo completo de 20s: idle -> susto -> se esconde -> espera -> vuelve */
.sway{animation:sway 5.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-2.5px) rotate(-1.5deg)}50%{transform:translateX(2.5px) rotate(1.5deg)}}

.peek{animation:peek 20s infinite}
@keyframes peek{
  0%,40%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,1.5,.4,1)}
  42%{transform:translateY(-7px);animation-timing-function:cubic-bezier(.55,0,.9,.35)}
  44.5%,70%{transform:translateY(96px);animation-timing-function:cubic-bezier(.22,.9,.3,1)}
  76%,100%{transform:translateY(0)}
}
.tilt{animation:tilt 20s infinite}
@keyframes tilt{0%,40%{transform:rotate(0)}42%,44%{transform:rotate(-9deg)}46%,100%{transform:rotate(0)}}

.eyes,.eye,.pup,.m-o,.m-idle{transform-box:fill-box;transform-origin:center}
.eyes{animation:wide 20s infinite}
@keyframes wide{0%,40%{transform:scale(1)}41%,43.5%{transform:scale(1.14)}45%,100%{transform:scale(1)}}
.eye{animation:blink 20s infinite}
@keyframes blink{
  0%,7.8%{transform:scaleY(1)}8.1%{transform:scaleY(.08)}8.4%,21.8%{transform:scaleY(1)}
  22.1%{transform:scaleY(.08)}22.4%,35.8%{transform:scaleY(1)}36.1%{transform:scaleY(.08)}
  36.4%,81.8%{transform:scaleY(1)}82.1%{transform:scaleY(.08)}82.4%,93.8%{transform:scaleY(1)}
  94.1%{transform:scaleY(.08)}94.4%,100%{transform:scaleY(1)}}
.pup{animation:glance 20s infinite}
@keyframes glance{
  0%,14%{transform:translateX(0) scale(1)}17%,21%{transform:translateX(-3.5px) scale(1)}
  25%,29%{transform:translateX(3.5px) scale(1)}33%,40%{transform:translateX(0) scale(1)}
  41%,43.5%{transform:translateX(0) scale(.72)}45%,86%{transform:translateX(0) scale(1)}
  89%,92%{transform:translateX(3px) scale(1)}95%,100%{transform:translateX(0) scale(1)}}
.m-o{opacity:0;animation:mo 20s infinite}
@keyframes mo{0%,40.4%{opacity:0}41%,43.5%{opacity:1}44.2%,100%{opacity:0}}
.m-idle{animation:mi 20s infinite}
@keyframes mi{0%,40.4%{opacity:1}41%,43.5%{opacity:0}44.2%,100%{opacity:1}}
.orb{animation:orb 2.6s ease-in-out infinite}@keyframes orb{50%{opacity:.4}}

.gl{opacity:0;animation:gl 20s infinite}
@keyframes gl{0%,39.6%{opacity:0}40%{opacity:1}40.7%{opacity:0}41.4%{opacity:.7}41.9%,100%{opacity:0}}
.glr{animation:glr 20s infinite}@keyframes glr{0%,39.6%{transform:none}40%{transform:translateX(-9px)}41.4%{transform:translateX(6px)}41.9%,100%{transform:none}}
.glc{animation:glc 20s infinite}@keyframes glc{0%,39.6%{transform:none}40%{transform:translateX(9px)}41.4%{transform:translateX(-6px)}41.9%,100%{transform:none}}
.bk{opacity:0;animation:bk 20s infinite}
@keyframes bk{0%,39.7%{opacity:0}40.1%{opacity:.85}40.9%{opacity:0}41.5%{opacity:.6}42%,100%{opacity:0}}
.scn{animation:scn 5s linear infinite}@keyframes scn{from{transform:translateY(-30px)}to{transform:translateY(200px)}}
.cur{animation:cur 1s steps(1) infinite}@keyframes cur{50%{opacity:0}}
.tt{font:12px "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;fill:#8b949e}
@media (prefers-reduced-motion:reduce){
  .sway,.peek,.tilt,.eyes,.eye,.pup,.m-o,.m-idle,.orb,.gl,.glr,.glc,.bk,.scn,.cur{animation:none}
  .m-o{opacity:0}
}
</style>

<g clip-path="url(#vp)">
  <rect width="1000" height="200" fill="#000"/>
  <rect width="1000" height="200" fill="url(#dt)"/>
  <g class="scn"><rect width="1000" height="30" fill="url(#sg)"/></g>

  <g transform="translate(500 0)">
    <g class="peek"><g class="sway"><g class="tilt">
      <g transform="translate(0 92)"><use href="#pipart"/></g>
    </g></g></g>
    <g class="gl glr" color="#ff2b6a" style="mix-blend-mode:screen"><use href="#ghost"/></g>
    <g class="gl glc" color="#00d4ff" style="mix-blend-mode:screen"><use href="#ghost"/></g>
    <use href="#cards"/>
  </g>

  <rect class="bk" x="300" y="96" width="60" height="3" fill="#ff2b6a"/>
  <rect class="bk" x="640" y="130" width="48" height="2" fill="#00d4ff" style="animation-delay:.15s"/>
  <rect class="bk" x="180" y="58" width="36" height="2" fill="#00e5a0" style="animation-delay:.3s"/>
  <rect class="bk" x="790" y="70" width="52" height="3" fill="#e8e8e8" style="animation-delay:.1s"/>

  <text x="40" y="34" class="tt">~/brandon $ ps aux | grep pip</text>
  <text x="960" y="34" text-anchor="end" class="tt" fill="#00e5a0" fill-opacity=".7">[ pip.exe ]</text>
  <text x="40" y="178" class="tt">// odia los glitches<tspan class="cur" fill="#00e5a0">_</tspan></text>
</g>
<rect x=".75" y=".75" width="998.5" height="198.5" rx="12" fill="none" stroke="#0f2a22" stroke-width="1.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" role="img" aria-label="Pip se asoma detras de las cartas">
<defs>
<pattern id="dt" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#00e5a0" fill-opacity=".12"/></pattern>
<linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00e5a0" stop-opacity="0"/><stop offset="1" stop-color="#00e5a0" stop-opacity=".16"/></linearGradient>
<linearGradient id="cf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1712"/><stop offset="1" stop-color="#030605"/></linearGradient>
<clipPath id="vp"><rect width="1000" height="200" rx="12"/></clipPath>
<g id="idle"><path fill="#22d3ff" d="M40 20h40v5h-40zM30 25h60v5h-60zM25 30h70v5h-70zM20 35h75v5h-75zM15 40h85v5h-85zM15 45h20v5h-20zM45 45h30v5h-30zM85 45h15v5h-15zM15 50h15v5h-15zM50 50h20v5h-20zM90 50h10v5h-10zM15 55h15v5h-15zM50 55h20v5h-20zM90 55h10v5h-10zM15 60h15v5h-15zM50 60h20v5h-20zM90 60h10v5h-10zM15 65h20v5h-20zM45 65h30v5h-30zM85 65h15v5h-15zM15 70h85v5h-85zM15 75h5v5h-5zM30 75h60v5h-60zM15 80h35v5h-35zM55 80h10v5h-10zM70 80h30v5h-30zM15 85h40v5h-40zM65 85h35v5h-35zM15 90h85v5h-85zM15 95h85v5h-85zM15 100h85v5h-85zM15 105h85v5h-85zM15 110h85v5h-85zM15 115h85v5h-85zM15 120h85v5h-85zM15 125h85v5h-85zM25 130h25v5h-25zM70 130h25v5h-25zM25 135h25v5h-25zM70 135h25v5h-25zM25 140h25v5h-25zM70 140h25v5h-25zM25 145h25v5h-25zM70 145h25v5h-25z"/><path fill="#0b8fb5" d="M55 10h10v5h-10zM55 15h10v5h-10zM95 35h5v5h-5zM100 40h5v5h-5zM100 45h5v5h-5zM100 50h5v5h-5zM100 55h5v5h-5zM100 60h5v5h-5zM100 65h5v5h-5zM100 70h5v5h-5zM20 75h10v5h-10zM90 75h15v5h-15zM100 80h5v5h-5zM100 85h5v5h-5zM100 90h5v5h-5zM100 95h5v5h-5zM100 100h5v5h-5zM100 105h5v5h-5zM100 110h5v5h-5zM100 115h5v5h-5zM100 120h5v5h-5zM100 125h5v5h-5z"/><path fill="#ffffff" d="M35 45h10v5h-10zM75 45h10v5h-10zM30 50h20v5h-20zM70 50h20v5h-20zM30 55h5v5h-5zM45 55h5v5h-5zM70 55h5v5h-5zM85 55h5v5h-5zM30 60h5v5h-5zM45 60h5v5h-5zM70 60h5v5h-5zM85 60h5v5h-5zM35 65h10v5h-10zM75 65h10v5h-10z"/><path fill="#04222e" d="M35 55h10v5h-10zM75 55h10v5h-10zM35 60h10v5h-10zM75 60h10v5h-10zM50 80h5v5h-5zM65 80h5v5h-5zM55 85h10v5h-10z"/><path fill="#baf5ff" d="M55 0h10v5h-10zM55 5h10v5h-10z"/></g>
<g id="scared"><path fill="#22d3ff" d="M40 20h40v5h-40zM30 25h60v5h-60zM25 30h70v5h-70zM20 35h75v5h-75zM15 40h85v5h-85zM15 45h15v5h-15zM50 45h20v5h-20zM90 45h10v5h-10zM15 50h15v5h-15zM50 50h20v5h-20zM90 50h10v5h-10zM15 55h15v5h-15zM50 55h20v5h-20zM90 55h10v5h-10zM15 60h15v5h-15zM50 60h20v5h-20zM90 60h10v5h-10zM15 65h15v5h-15zM50 65h20v5h-20zM90 65h10v5h-10zM15 70h85v5h-85zM15 75h5v5h-5zM30 75h60v5h-60zM15 80h35v5h-35zM70 80h30v5h-30zM15 85h35v5h-35zM70 85h30v5h-30zM15 90h40v5h-40zM65 90h35v5h-35zM15 95h85v5h-85zM15 100h85v5h-85zM15 105h85v5h-85zM15 110h85v5h-85zM15 115h85v5h-85zM15 120h85v5h-85zM15 125h85v5h-85zM25 130h25v5h-25zM70 130h25v5h-25zM25 135h25v5h-25zM70 135h25v5h-25zM25 140h25v5h-25zM70 140h25v5h-25zM25 145h25v5h-25zM70 145h25v5h-25z"/><path fill="#0b8fb5" d="M55 10h10v5h-10zM55 15h10v5h-10zM95 35h5v5h-5zM100 40h5v5h-5zM100 45h5v5h-5zM100 50h5v5h-5zM100 55h5v5h-5zM100 60h5v5h-5zM100 65h5v5h-5zM100 70h5v5h-5zM20 75h10v5h-10zM90 75h15v5h-15zM100 80h5v5h-5zM100 85h5v5h-5zM100 90h5v5h-5zM100 95h5v5h-5zM100 100h5v5h-5zM100 105h5v5h-5zM100 110h5v5h-5zM100 115h5v5h-5zM100 120h5v5h-5zM100 125h5v5h-5z"/><path fill="#ffffff" d="M30 45h20v5h-20zM70 45h20v5h-20zM30 50h5v5h-5zM45 50h5v5h-5zM70 50h5v5h-5zM85 50h5v5h-5zM30 55h5v5h-5zM45 55h5v5h-5zM70 55h5v5h-5zM85 55h5v5h-5zM30 60h20v5h-20zM70 60h20v5h-20zM30 65h20v5h-20zM70 65h20v5h-20z"/><path fill="#04222e" d="M35 50h10v5h-10zM75 50h10v5h-10zM35 55h10v5h-10zM75 55h10v5h-10zM50 80h20v5h-20zM50 85h20v5h-20zM55 90h10v5h-10z"/><path fill="#baf5ff" d="M55 0h10v5h-10zM55 5h10v5h-10z"/></g>
<g id="cards">
  <g transform="translate(-92 0) rotate(-9 0 150)"><rect x="-52" y="98" width="104" height="102" rx="9" fill="url(#cf)" stroke="#0f2a22"/>
    <text x="-38" y="122" font-family="monospace" font-size="13" fill="#00e5a0" fill-opacity=".75">&lt;/&gt;</text></g>
  <g transform="translate(92 0) rotate(9 0 150)"><rect x="-52" y="98" width="104" height="102" rx="9" fill="url(#cf)" stroke="#0f2a22"/>
    <text x="24" y="122" font-family="monospace" font-size="13" fill="#00e5a0" fill-opacity=".75" text-anchor="end">{ }</text></g>
  <g><rect x="-58" y="98" width="116" height="102" rx="10" fill="url(#cf)" stroke="#0f2a22" stroke-width="1.2"/>
    <text x="-44" y="122" font-family="monospace" font-size="13" fill="#00e5a0">$_</text>
    <rect x="-44" y="134" width="60" height="3" rx="1.5" fill="#00e5a0" fill-opacity=".45"/>
    <rect x="-44" y="144" width="80" height="3" rx="1.5" fill="#e8e8e8" fill-opacity=".22"/>
    <rect x="-44" y="154" width="44" height="3" rx="1.5" fill="#e8e8e8" fill-opacity=".22"/></g>
</g>
<g id="ghost"><rect x="-58" y="98" width="116" height="102" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="-144" y="98" width="104" height="102" rx="9" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-9 -92 150)"/>
  <rect x="40" y="98" width="104" height="102" rx="9" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(9 92 150)"/></g>
</defs>

<style>
/* ciclo de 20s: idle -> susto -> se esconde -> espera -> vuelve */
.sway{animation:sway 5.2s steps(2,jump-none) infinite}
@keyframes sway{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.peek{animation:peek 20s infinite}
@keyframes peek{
  0%,40%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,1.5,.4,1)}
  42%{transform:translateY(-10px);animation-timing-function:cubic-bezier(.55,0,.9,.35)}
  44.5%,70%{transform:translateY(105px);animation-timing-function:cubic-bezier(.22,.9,.3,1)}
  76%,100%{transform:translateY(0)}}
.tilt{animation:tilt 20s infinite}
@keyframes tilt{0%,40%{transform:rotate(0)}42%,44%{transform:rotate(-8deg)}46%,100%{transform:rotate(0)}}
.f-idle{animation:fi 20s steps(1) infinite}
@keyframes fi{0%,40.4%{opacity:1}41%,43.5%{opacity:0}44.2%,100%{opacity:1}}
.f-scared{opacity:0;animation:fs 20s steps(1) infinite}
@keyframes fs{0%,40.4%{opacity:0}41%,43.5%{opacity:1}44.2%,100%{opacity:0}}
.blink{opacity:0;animation:bl 20s steps(1) infinite}
@keyframes bl{0%,7.8%{opacity:0}8.1%{opacity:1}8.5%,21.8%{opacity:0}22.1%{opacity:1}22.5%,35.8%{opacity:0}
  36.1%{opacity:1}36.5%,81.8%{opacity:0}82.1%{opacity:1}82.5%,93.8%{opacity:0}94.1%{opacity:1}94.5%,100%{opacity:0}}
.look{animation:look 20s steps(1) infinite}
@keyframes look{0%,16%{transform:translateX(0)}17%,21%{transform:translateX(-5px)}22%,25%{transform:translateX(0)}
  26%,30%{transform:translateX(5px)}31%,88%{transform:translateX(0)}89%,92%{transform:translateX(5px)}93%,100%{transform:translateX(0)}}
.orb{animation:orb 1.6s steps(1) infinite}@keyframes orb{50%{opacity:.35}}
.gl{opacity:0;animation:gl 20s steps(1) infinite}
@keyframes gl{0%,39.6%{opacity:0}40%{opacity:1}40.7%{opacity:0}41.4%{opacity:.7}41.9%,100%{opacity:0}}
.glr{animation:glr 20s steps(1) infinite}@keyframes glr{0%,39.6%{transform:none}40%{transform:translateX(-10px)}41.4%{transform:translateX(7px)}41.9%,100%{transform:none}}
.glc{animation:glc 20s steps(1) infinite}@keyframes glc{0%,39.6%{transform:none}40%{transform:translateX(10px)}41.4%{transform:translateX(-7px)}41.9%,100%{transform:none}}
.bk{opacity:0;animation:bk 20s steps(1) infinite}
@keyframes bk{0%,39.7%{opacity:0}40.1%{opacity:.85}40.9%{opacity:0}41.5%{opacity:.6}42%,100%{opacity:0}}
.scn{animation:scn 5s linear infinite}@keyframes scn{from{transform:translateY(-30px)}to{transform:translateY(200px)}}
.cur{animation:cur 1s steps(1) infinite}@keyframes cur{50%{opacity:0}}
.tt{font:12px "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;fill:#8b949e}
@media (prefers-reduced-motion:reduce){
  .sway,.peek,.tilt,.f-idle,.f-scared,.blink,.look,.orb,.gl,.glr,.glc,.bk,.scn,.cur{animation:none}
  .f-scared,.blink,.gl,.bk{opacity:0}}
</style>

<g clip-path="url(#vp)">
  <rect width="1000" height="200" fill="#000"/>
  <rect width="1000" height="200" fill="url(#dt)"/>
  <g class="scn"><rect width="1000" height="30" fill="url(#sg)"/></g>

  <g transform="translate(500 0)">
    <g class="peek"><g class="sway"><g class="tilt">
      <g transform="translate(-60 3)">
        <g class="look"><use class="f-idle" href="#idle"/><use class="f-scared" href="#scared"/></g>
        <g class="blink"><path fill="#0b8fb5" d="M30 50h20v15h-20z M70 50h20v15h-20z"/></g>
      </g>
    </g></g></g>
    <g class="gl glr" color="#ff2b6a" style="mix-blend-mode:screen"><use href="#ghost"/></g>
    <g class="gl glc" color="#22d3ff" style="mix-blend-mode:screen"><use href="#ghost"/></g>
    <use href="#cards"/>
  </g>

  <rect class="bk" x="300" y="96" width="60" height="3" fill="#ff2b6a"/>
  <rect class="bk" x="640" y="130" width="48" height="2" fill="#22d3ff" style="animation-delay:.15s"/>
  <rect class="bk" x="180" y="58" width="36" height="2" fill="#00e5a0" style="animation-delay:.3s"/>
  <rect class="bk" x="790" y="70" width="52" height="3" fill="#e8e8e8" style="animation-delay:.1s"/>

  <text x="40" y="34" class="tt">~/brandon $ ps aux | grep pip</text>
  <text x="960" y="34" text-anchor="end" class="tt" fill="#22d3ff" fill-opacity=".8">[ pip.exe ]</text>
  <text x="40" y="178" class="tt">// odia los glitches<tspan class="cur" fill="#22d3ff">_</tspan></text>
</g>
<rect x=".75" y=".75" width="998.5" height="198.5" rx="12" fill="none" stroke="#0f2a22" stroke-width="1.5"/>
</svg>